name: cartao_qr_reader
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  mobile_scanner: ^3.5.6
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  min_sdk_android: 21

  adaptive_icon_foreground: "assets/icons/verificadorlogo.png"
  adaptive_icon_background: "#ff3131"
  image_path: "assets/icons/verificadorlogo.png"

  adaptive_only: true

flutter:
  uses-material-design: true

  assets:
    - assets/check.png
    - assets/no.png
    - assets/icons/verificadorlogo.png
